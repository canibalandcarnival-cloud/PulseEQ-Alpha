name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project root
        id: root
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

     - name: Install dependencies and build web app
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          npm install --legacy-peer-deps
          npx vite build

      - name: Install Capacitor and add Android
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -d "dist" ]; then WEB_DIR="dist"; else WEB_DIR="build"; fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.json
          npx cap init "PulseEQ" "com.pulseeq.app" --web-dir="$WEB_DIR"
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build Debug APK
        working-directory: ${{ steps.root.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseEQ-APK
          path: ${{ steps.root.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
